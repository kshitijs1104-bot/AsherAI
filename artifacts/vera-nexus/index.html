    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The landing page and the marketing/enterprise screens. The app itself
         no longer pulls a webfont at all: all three identities render on the
         platform's own variable families at their real optical sizes (Segoe UI
         Variable Display/Text/Small, SF Pro Display/Text), which is both
         sharper than a downloaded face and one fewer render-blocking request.
         Fraunces stays only as the declared fallback in CommandCenter.tsx.

         Dropped with the old skins: M PLUS Rounded 1c, Archivo, Instrument
         Sans, Instrument Serif, Onest, Azeret Mono, Spline Sans Mono. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
